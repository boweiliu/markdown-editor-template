<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Editor</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="file-title">
        <svg class="file-glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5.2L12.5 4.8V14a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5V2a.5.5 0 0 1 .5-.5Z" fill="none" stroke="currentColor"/><path d="M9 1.8V5h3.2" fill="none" stroke="currentColor"/></svg>
        <span id="file-name">Markdown Editor</span>
        <span id="file-size" class="muted"></span>
      </div>
      <div class="topbar-right">
        <div class="mode-switch" id="mode-switch" role="radiogroup" aria-label="Editing mode" hidden>
          <button type="button" data-mode="suggest" id="mode-suggest" title="Your edits are tracked as suggestions; you can comment">Suggest</button>
          <button type="button" data-mode="edit" id="mode-edit" title="Your edits change the file directly">Edit</button>
          <button type="button" data-mode="read" id="mode-read" title="Read only">Read</button>
        </div>
        <span id="save-status" class="muted save-status"></span>
        <button type="button" id="toggle-source" class="quiet" hidden title="Show the file exactly as it is saved">Source</button>
        <a id="download" class="quiet button-like" hidden title="Download the file as saved">Download</a>
        <a id="open-other" class="quiet button-like" href="/" title="Open another file">Open</a>
      </div>
    </header>

    <div class="toolbar" id="toolbar" hidden>
      <button type="button" data-command="h1" id="tool-h1" title="Heading 1">H1</button>
      <button type="button" data-command="h2" id="tool-h2" title="Heading 2">H2</button>
      <button type="button" data-command="bold" id="tool-bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button type="button" data-command="italic" id="tool-italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button type="button" data-command="bullet" id="tool-bullet" title="Bulleted list">&bull;</button>
      <button type="button" data-command="ordered" id="tool-ordered" title="Numbered list">1.</button>
      <button type="button" data-command="quote" id="tool-quote" title="Quote">&ldquo;</button>
      <button type="button" data-command="link" id="tool-link" title="Link">Link</button>
      <button type="button" data-command="comment" id="tool-comment" title="Comment on the selected text (Ctrl+Alt+M)">Comment</button>
      <span class="toolbar-gap"></span>
      <button type="button" data-command="undo" id="tool-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button type="button" data-command="redo" id="tool-redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <span class="review" id="review" hidden>
        <span id="review-counts" class="muted"></span>
        <button type="button" id="accept-all" title="Keep every suggested change">Accept all</button>
        <button type="button" id="reject-all" title="Undo every suggested change">Reject all</button>
      </span>
    </div>

    <div class="banner" id="banner" hidden>
      <span id="banner-text"></span>
      <span class="banner-actions" id="banner-actions"></span>
    </div>

    <main id="main">
      <section class="picker" id="picker" hidden>
        <h1>Open a markdown file</h1>
        <form id="open-form" class="open-form">
          <input id="open-path" name="path" type="text" placeholder="/home/user/workspace/notes/plan.md" autocomplete="off" spellcheck="false" />
          <button type="submit" id="open-submit">Open</button>
        </form>
        <h2 id="recent-heading" hidden>Recently opened</h2>
        <ul class="file-list" id="recent-list"></ul>
        <h2>Markdown files in the workspace</h2>
        <p class="muted" id="found-status">Looking...</p>
        <ul class="file-list" id="found-list"></ul>
      </section>

      <article class="document" id="document" hidden>
        <details class="front-matter" id="front-matter" hidden>
          <summary>Properties</summary>
          <pre id="front-matter-text"></pre>
        </details>
        <div id="editor" class="prose"></div>
        <pre class="source-view" id="source-view" hidden></pre>
      </article>

      <p class="load-error" id="load-error" hidden></p>
    </main>

    <div class="popover" id="popover" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
